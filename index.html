<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#173f42" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="피자마을" />
    <meta name="description" content="2D 캐릭터와 3D 마을이 만나는 아이패드용 산책 게임" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>피자마을 산책</title>
  </head>
  <body>
    <main id="app" aria-label="피자마을 산책">
      <section id="game-screen" class="game-screen" aria-label="게임 화면">
        <div id="game-root" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <header class="hud safe-top">
          <button id="home-button" class="icon-button" type="button" aria-label="처음 화면으로">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15.2 16 6l11 9.2v11.3h-7v-7h-8v7H5Z"/></svg>
          </button>
          <div id="objective" class="objective">
            <span class="objective-dot" aria-hidden="true"></span>
            <strong id="objective-text">피자가게 문까지 걸어가요</strong>
          </div>
          <button id="sound-button" class="icon-button" type="button" aria-label="소리 끄기" aria-pressed="false">
            <svg class="sound-on" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 13h6l7-6v18l-7-6H6Zm17-1.5c2 2.4 2 6.6 0 9M26 8c4.6 4.6 4.6 11.4 0 16"/></svg>
            <svg class="sound-off" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 13h6l7-6v18l-7-6H6Zm17-1 7 8m0-8-7 8"/></svg>
          </button>
        </header>

        <div id="joystick-zone" class="joystick-zone safe-bottom" aria-label="이동 조이스틱">
          <div class="joystick-base"><div id="joystick-stick" class="joystick-stick"></div></div>
        </div>

        <button id="action-button" class="action-button safe-bottom" type="button" aria-label="살펴보기">
          <svg viewBox="0 0 52 52" aria-hidden="true"><path d="M20 28V13c0-4 6-4 6 0v10-13c0-4 6-4 6 0v13-10c0-4 6-4 6 0v13-8c0-4 6-4 6 0v12c0 11-7 18-17 18h-3c-7 0-11-4-14-10l-4-8c-2-4 3-7 6-3l8 11Z"/></svg>
          <small id="action-label">살펴보기</small>
        </button>

        <div id="scene-toast" class="scene-toast" aria-live="polite"></div>
      </section>

      <section id="start-screen" class="start-screen" aria-labelledby="start-title">
        <div class="start-card">
          <p class="start-kicker">BORI'S LITTLE DAY</p>
          <h1 id="start-title">피자마을<br />산책</h1>
          <p>보리와 함께 피자가게 문을 열어봐요.</p>
          <button id="start-button" class="start-button" type="button">
            <span>마을로 들어가기</span>
            <svg viewBox="0 0 34 24" aria-hidden="true"><path d="m20 3 10 9-10 9M4 12h25"/></svg>
          </button>
          <div class="start-help">
            <span><i class="mini-stick" aria-hidden="true"></i> 왼쪽으로 걷기</span>
            <span><i class="mini-button" aria-hidden="true"></i> 오른쪽으로 행동</span>
          </div>
        </div>
      </section>

      <section class="rotate-screen" aria-label="아이패드를 가로로 돌려주세요">
        <div class="rotate-tablet" aria-hidden="true"><span></span></div>
        <strong>아이패드를 가로로 돌려주세요</strong>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
